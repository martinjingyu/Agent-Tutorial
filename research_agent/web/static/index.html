<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Dashboard</title>
<style>
:root {
  --bg:      #0d1117;
  --bg2:     #161b22;
  --bg3:     #21262d;
  --border:  #30363d;
  --text:    #e6edf3;
  --muted:   #8b949e;
  --cyan:    #79c0ff;
  --green:   #56d364;
  --yellow:  #e3b341;
  --red:     #f85149;
  --purple:  #bc8cff;
  --orange:  #ffa657;
  --radius:  6px;
  --mono:    'SF Mono','Fira Code','Consolas',monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size: 14px; height: 100vh;
  display: flex; flex-direction: column; overflow: hidden;
}

/* ── Topbar ─────────────────────────────────────────────────── */
#topbar {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 0 16px; height: 46px;
  display: flex; align-items: center; gap: 14px; flex-shrink: 0;
}
#topbar h1 { font-size: 14px; font-weight: 700; color: var(--cyan); white-space: nowrap; }
.stat-pill {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 20px; padding: 2px 10px; font-size: 12px; color: var(--muted); white-space: nowrap;
}
.stat-pill span { color: var(--text); font-weight: 600; }
#live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; margin-left: auto; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
#live-time { color: var(--muted); font-size: 11px; font-family: var(--mono); }

/* ── Layout ─────────────────────────────────────────────────── */
#layout { display: flex; flex: 1; overflow: hidden; }

/* ── Sidebar ─────────────────────────────────────────────────── */
#sidebar {
  width: 196px; background: var(--bg2); border-right: 1px solid var(--border);
  flex-shrink: 0; display: flex; flex-direction: column; overflow-y: auto;
}
.nav-section { padding: 12px 8px 4px; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.nav-item {
  padding: 6px 10px; border-radius: var(--radius); margin: 1px 5px;
  cursor: pointer; font-size: 13px; color: var(--muted);
  display: flex; align-items: center; gap: 7px;
  transition: background .1s, color .1s;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active { background: var(--bg3); color: var(--cyan); font-weight: 600; }
.nav-item .badge { margin-left: auto; background: var(--green); color: #000; border-radius: 10px; padding: 0 5px; font-size: 10px; font-weight: 700; }
.nav-icon { width: 14px; text-align: center; flex-shrink: 0; font-size: 12px; }

/* ── Main ───────────────────────────────────────────────────── */
#main { flex: 1; overflow-y: auto; padding: 18px 20px; }

/* ── Cards ──────────────────────────────────────────────────── */
.panel { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; }
.panel-header {
  padding: 9px 13px; border-bottom: 1px solid var(--border);
  font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px;
}
.panel-body { padding: 13px; }

/* ── Overview ────────────────────────────────────────────────── */
.overview-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 14px; }
.stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
.stat-card .label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }
.stat-card .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
.c-cyan{color:var(--cyan)} .c-green{color:var(--green)} .c-yellow{color:var(--yellow)} .c-purple{color:var(--purple)}

/* ── Kanban ──────────────────────────────────────────────────── */
.kanban-columns { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; min-height: 100px; }
.kanban-col { background: var(--bg3); border-radius: var(--radius); padding: 8px; }
.kanban-col-header { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; padding-bottom: 5px; border-bottom: 2px solid; }
.col-ready   .kanban-col-header { color: var(--muted);  border-color: var(--muted); }
.col-running .kanban-col-header { color: var(--cyan);   border-color: var(--cyan); }
.col-done    .kanban-col-header { color: var(--green);  border-color: var(--green); }
.col-error   .kanban-col-header { color: var(--red);    border-color: var(--red); }

.task-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; padding: 7px 9px; margin-bottom: 5px; cursor: pointer; transition: border-color .1s; font-size: 12px; }
.task-card:hover { border-color: var(--cyan); }
.task-card .task-title { font-weight: 600; color: var(--text); margin-bottom: 3px; line-height: 1.3; }
.task-card .task-id    { color: var(--muted); font-family: var(--mono); font-size: 10px; }
.task-card .task-timer { color: var(--yellow); font-family: var(--mono); font-size: 10px; margin-top: 3px; }
.task-card .task-skill { color: var(--purple); font-size: 10px; margin-top: 2px; }
.task-output { display: none; margin-top: 7px; padding: 7px; background: var(--bg); border-radius: 3px; font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
.task-card.expanded .task-output { display: block; }

/* ── Meeting ─────────────────────────────────────────────────── */
.meeting-status { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; flex-shrink: 0; }
.meeting-status.open   { background: #56d36422; color: var(--green); }
.meeting-status.closed { background: #8b949e22; color: var(--muted); }
.participants-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(210px,1fr)); gap: 8px; margin-bottom: 10px; }
.participant-card { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 9px; }
.participant-card.spoke { border-color: var(--green); }
.participant-card.spoke .p-name::before { content: "✓ "; color: var(--green); }
.p-name { font-weight: 600; font-size: 13px; margin-bottom: 1px; }
.p-role { color: var(--purple); font-size: 10px; margin-bottom: 6px; }
.p-response { font-size: 12px; color: var(--muted); line-height: 1.5; max-height: 100px; overflow-y: auto; white-space: pre-wrap; }
.transcript-entry { display: flex; gap: 8px; margin-bottom: 8px; padding: 7px 9px; background: var(--bg3); border-radius: 4px; font-size: 12px; }
.t-speaker { color: var(--cyan); font-weight: 600; white-space: nowrap; font-family: var(--mono); min-width: 80px; }
.transcript-entry.moderator .t-speaker { color: var(--orange); }
.t-content { color: var(--text); line-height: 1.5; white-space: pre-wrap; }
.meeting-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.meeting-action { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; }
.meeting-action .a-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.meeting-action .a-type { color: var(--orange); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.meeting-action .a-time { color: var(--muted); font-family: var(--mono); font-size: 10px; margin-left: auto; }
.meeting-action .a-body { color: var(--text); font-size: 12px; line-height: 1.55; white-space: pre-wrap; }
.meeting-action .a-meta { color: var(--muted); font-size: 11px; margin-bottom: 6px; }
.meeting-response { background: var(--bg3); border-left: 2px solid var(--cyan); padding: 7px 8px; margin-top: 6px; border-radius: 3px; }
.meeting-response .speaker { color: var(--cyan); font-weight: 700; font-size: 11px; margin-bottom: 3px; }
.conclusion-box { background: #56d36411; border: 1px solid #56d36444; border-radius: var(--radius); padding: 10px; margin-top: 10px; font-size: 13px; line-height: 1.6; color: var(--text); white-space: pre-wrap; }
.conclusion-box::before { content: "Conclusion"; display: block; color: var(--green); font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px; }
.notes-box { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 9px; font-size: 12px; color: var(--muted); white-space: pre-wrap; line-height: 1.5; margin-top: 8px; }
.notes-box::before { content: "Notes"; display: block; color: var(--orange); font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }

/* ── Session messages ────────────────────────────────────────── */
.message-list { display: flex; flex-direction: column; gap: 8px; }
.msg { border-radius: var(--radius); padding: 9px 11px; font-size: 13px; line-height: 1.6; }
.msg.user      { background: var(--bg3); border-left: 3px solid var(--cyan); }
.msg.assistant { background: var(--bg2); border: 1px solid var(--border); border-left: 3px solid var(--purple); }
.msg.tool      { background: var(--bg3); border-left: 3px solid var(--green); }
.msg-role { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px; }
.msg.user      .msg-role { color: var(--cyan); }
.msg.assistant .msg-role { color: var(--purple); }
.msg.tool      .msg-role { color: var(--green); }
.msg-content { white-space: pre-wrap; word-break: break-word; color: var(--text); }
.msg-content.collapsed, .tool-call-args.collapsed { max-height: 8em; overflow: hidden; }
.tool-call { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 7px 9px; margin-top: 6px; }
.tool-call-name { color: var(--orange); font-weight: 600; font-family: var(--mono); font-size: 12px; }
.tool-call-args { color: var(--muted); margin-top: 4px; white-space: pre-wrap; font-family: var(--mono); font-size: 11px; }
.expand-btn { background: none; border: 1px solid var(--border); border-radius: 3px; color: var(--muted); font-size: 10px; padding: 1px 7px; cursor: pointer; margin-top: 3px; }
.expand-btn:hover { color: var(--text); border-color: var(--cyan); }

/* ── Chat view ───────────────────────────────────────────────── */
#chat-area { display: flex; flex-direction: column; height: 100%; gap: 0; }
#chat-messages {
  flex: 1; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
}
#chat-input-bar {
  border-top: 1px solid var(--border); background: var(--bg2);
  padding: 10px 14px; display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0;
}
#chat-input {
  flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text); font-size: 13px; padding: 8px 10px; resize: none; outline: none;
  font-family: inherit; line-height: 1.5; min-height: 38px; max-height: 160px;
}
#chat-input:focus { border-color: var(--cyan); }
#chat-send {
  background: var(--cyan); color: #000; border: none; border-radius: var(--radius);
  padding: 8px 14px; font-weight: 700; font-size: 13px; cursor: pointer; flex-shrink: 0; height: 38px;
}
#chat-send:hover { background: #a8d8ff; }
#chat-send:disabled { opacity: .4; cursor: not-allowed; }
.interrupt-btn {
  background: #ff7b7222; color: var(--red); border: 1px solid #ff7b7255;
  border-radius: var(--radius); padding: 8px 12px; font-weight: 700;
  font-size: 13px; cursor: pointer; flex-shrink: 0; height: 38px;
}
.interrupt-btn:hover { background: #ff7b7233; }
.interrupt-btn:disabled { opacity: .45; cursor: not-allowed; }
.task-actions { display: flex; gap: 6px; margin-top: 6px; }
.task-actions .interrupt-btn { height: auto; padding: 3px 7px; font-size: 10px; }
.chat-msg { max-width: 84%; font-size: 13px; line-height: 1.6; }
.chat-msg.user-msg { align-self: flex-end; background: var(--cyan); color: #000; padding: 8px 12px; border-radius: 10px 10px 2px 10px; }
.chat-msg.bot-msg  { align-self: flex-start; background: var(--bg2); border: 1px solid var(--border); padding: 8px 12px; border-radius: 2px 10px 10px 10px; white-space: pre-wrap; }
.chat-msg.sys-msg  { align-self: center; font-size: 11px; color: var(--muted); font-family: var(--mono); background: var(--bg3); padding: 3px 10px; border-radius: 10px; }
.worker-modal-overlay { position: fixed; inset: 0; background: rgba(1,4,9,.72); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 28px; }
.worker-modal { width: min(980px, 96vw); height: min(760px, 90vh); background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; box-shadow: 0 18px 60px rgba(0,0,0,.45); }
.worker-modal-head { padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--bg2); display: flex; align-items: center; gap: 10px; }
.worker-modal-title { font-weight: 700; font-size: 13px; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.worker-modal-meta { color: var(--muted); font-family: var(--mono); font-size: 10px; }
.worker-modal-body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.worker-modal-close { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: var(--radius); padding: 4px 9px; cursor: pointer; }
.worker-modal-close:hover { color: var(--text); border-color: var(--cyan); }
.spinner { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--border); border-top-color: var(--cyan); border-radius: 50%; animation: spin .6s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.active-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 6px; animation: pulse 1.4s ease-in-out infinite; flex-shrink: 0; }
@keyframes pulse { 0%,100% { opacity: 1; box-shadow: 0 0 0 0 rgba(80,220,100,.5); } 50% { opacity: .8; box-shadow: 0 0 0 4px rgba(80,220,100,0); } }
.session-row.active { border-left: 2px solid var(--green); }

/* ── Stream log (live tool call feed) ───────────────────────── */
.stream-log {
  align-self: stretch; background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 6px 8px; font-family: var(--mono); font-size: 12px;
}
.stream-iter {
  color: var(--muted); font-size: 10px; padding: 3px 4px 3px 2px;
  display: flex; align-items: center; gap: 5px; border-bottom: 1px solid var(--border); margin-bottom: 2px; margin-top: 4px;
}
.stream-iter:first-child { margin-top: 0; }
.stream-iter-num { color: var(--cyan); font-weight: 700; }
.stream-tool { border-radius: 3px; }
.stream-tool-row {
  display: flex; align-items: center; gap: 6px; padding: 3px 4px;
  cursor: pointer; border-radius: 3px; user-select: none;
}
.stream-tool-row:hover { background: var(--bg2); }
.stream-tool-icon { width: 14px; text-align: center; flex-shrink: 0; line-height: 1; }
.stream-tool-name { color: var(--orange); font-weight: 600; flex: 1; font-size: 12px; }
.stream-tool.done  .stream-tool-name { color: var(--text); font-weight: 400; }
.stream-tool.error .stream-tool-name { color: var(--red); }
.stream-tool-elapsed { color: var(--muted); font-size: 10px; min-width: 36px; text-align: right; }
.stream-tool-chevron { color: var(--muted); font-size: 10px; width: 10px; }
.stream-tool-args {
  display: none; margin: 1px 4px 4px 20px; padding: 5px 8px;
  background: var(--bg); border-radius: 3px; color: var(--muted);
  white-space: pre-wrap; font-size: 11px; max-height: 240px; overflow-y: auto;
  border-left: 2px solid var(--border);
}
.stream-tool-args.open { display: block; }
.stream-sys { color: var(--muted); font-size: 10px; padding: 3px 4px; font-style: italic; }

/* ── Session header bar ──────────────────────────────────────── */
.chat-header { padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--bg2); display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.chat-header .sid { font-family: var(--mono); color: var(--cyan); font-size: 11px; }

/* ── Costs ───────────────────────────────────────────────────── */
.cost-table { width: 100%; border-collapse: collapse; font-size: 13px; font-family: var(--mono); }
.cost-table th { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.cost-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); color: var(--text); }
.cost-table tr:hover td { background: var(--bg3); }
.cost-table .num { text-align: right; color: var(--cyan); }
.cost-table .cost-val { color: var(--yellow); }

/* ── Misc ────────────────────────────────────────────────────── */
.section-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
.empty-state { text-align: center; padding: 36px; color: var(--muted); font-size: 13px; }
.loading { color: var(--muted); padding: 20px; text-align: center; }
.tag { display: inline-block; padding: 1px 6px; border-radius: 8px; font-size: 10px; font-weight: 600; }
.tag.running{ background:#79c0ff22; color:var(--cyan)  }
.tag.done   { background:#56d36422; color:var(--green) }
.tag.error  { background:#f8514922; color:var(--red)   }
.tag.ready  { background:#8b949e22; color:var(--muted) }
.tag.blocked{ background:#e3b34122; color:var(--yellow)}

.back-btn { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: var(--radius); padding: 4px 10px; cursor: pointer; font-size: 12px; margin-bottom: 12px; display: inline-flex; align-items: center; gap: 5px; }
.back-btn:hover { color: var(--text); border-color: var(--cyan); }

.session-row { display: flex; align-items: center; padding: 7px 11px; border-bottom: 1px solid var(--border); cursor: pointer; gap: 10px; transition: background .1s; }
.session-row:hover { background: var(--bg3); }
.s-id    { font-family: var(--mono); font-size: 11px; color: var(--cyan); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-model { color: var(--purple); font-size: 11px; min-width: 110px; }
.s-msgs  { color: var(--muted);  font-size: 11px; min-width: 55px; text-align: right; }
.s-cost  { color: var(--yellow); font-family: var(--mono); font-size: 11px; min-width: 72px; text-align: right; }
.s-date  { color: var(--muted);  font-size: 10px; min-width: 120px; text-align: right; }

/* ── Delete button ───────────────────────────────────────────── */
.del-btn {
  background: none; border: 1px solid transparent; border-radius: 4px;
  color: var(--muted); font-size: 12px; padding: 2px 6px; cursor: pointer;
  flex-shrink: 0; transition: color .1s, border-color .1s;
}
.del-btn:hover { color: var(--red); border-color: var(--red); }
.shutdown-btn {
  background: #ff7b7222; color: var(--red); border: 1px solid #ff7b7255;
  border-radius: 4px; padding: 3px 8px; font-size: 11px; cursor: pointer;
}
.shutdown-btn:hover { background: #ff7b7233; }
.shutdown-btn:disabled { opacity: .5; cursor: not-allowed; }

/* ── Model selector for chat ─────────────────────────────────── */
#chat-model-bar { padding: 6px 14px; border-bottom: 1px solid var(--border); background: var(--bg2); display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); flex-shrink: 0; }
#chat-model-bar select { background: var(--bg3); border: 1px solid var(--border); color: var(--text); border-radius: 4px; padding: 3px 6px; font-size: 12px; }
</style>
</head>
<body>

<div id="topbar">
  <h1>⬡ Agent Dashboard</h1>
  <div class="stat-pill">Sessions: <span id="tb-sessions">—</span></div>
  <div class="stat-pill">Boards: <span id="tb-boards">—</span></div>
  <div class="stat-pill">Meetings: <span id="tb-meetings">—</span></div>
  <div class="stat-pill">Cost: <span id="tb-cost">—</span></div>
  <div id="live-dot"></div>
  <div id="live-time">—</div>
  <button id="shutdown-server" class="shutdown-btn" onclick="shutdownServer(this)">Shutdown</button>
</div>

<div id="layout">
  <div id="sidebar">
    <div class="nav-section">Views</div>
    <div class="nav-item active" data-view="overview" onclick="nav('overview')"><span class="nav-icon">◉</span> Overview</div>
    <div class="nav-item" data-view="chat"     onclick="startNewTalk()"><span class="nav-icon">✦</span> New Chat</div>
    <div class="nav-item" data-view="sessions" onclick="nav('sessions')"><span class="nav-icon">◈</span> Sessions</div>
    <div class="nav-item" data-view="kanban"   onclick="nav('kanban')"><span class="nav-icon">⊞</span> Kanban</div>
    <div class="nav-item" data-view="meetings" onclick="nav('meetings')"><span class="nav-icon">◎</span> Meetings</div>
    <div class="nav-item" data-view="costs"    onclick="nav('costs')"><span class="nav-icon">◇</span> Costs</div>

    <div class="nav-section" id="talks-section" style="display:none">Talks</div>
    <div id="talks-nav"></div>
    <div class="nav-section" id="active-boards-section" style="display:none">Active Boards</div>
    <div id="active-boards-nav"></div>
    <div class="nav-section" id="open-meetings-section" style="display:none">Open Meetings</div>
    <div id="open-meetings-nav"></div>
  </div>

  <div id="main"><div class="loading">Loading…</div></div>
</div>

<script>
// ── Content store (avoids inline onclick data escaping issues) ──
const _cs = new Map();   // id → raw text (for tool call args and tool results)
let _csIdx = 0;
function csStore(text) { const id = 'cs' + (++_csIdx); _cs.set(id, text); return id; }
function csExpand(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  const full = _cs.get(el.dataset.csId);
  if (full !== undefined) { el.textContent = full; el.style.maxHeight = 'none'; el.style.overflow = 'visible'; el.classList.add('expanded'); }
  if (btn) btn.remove();
}
function csToggle(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  const isCollapsed = el.classList.contains('collapsed');
  if (isCollapsed) {
    el.classList.remove('collapsed');
    if (btn) btn.textContent = 'collapse';
  } else {
    el.classList.add('collapsed');
    if (btn) btn.textContent = 'expand';
  }
}

// ── State ──────────────────────────────────────────────────────
let currentView = 'overview';
let _chatSessionId  = null;
let _chatSSE        = null;
let _chatRunning    = false;
let _streamLog           = null;   // current stream-log div
let _currentToolEl       = null;   // current running tool div
let _toolStartMs         = 0;      // when current tool started
let _sessionsRefreshTimer = null;  // auto-refresh timer for sessions view
let _workerModalTimer = null;
let _workerModalTarget = null;
let _assistantMessageShown = false;
let _lastAssistantMessageText = '';

// ── Navigation ─────────────────────────────────────────────────
function nav(view, params) {
  const previousView = currentView;
  if (previousView === 'chat' && view !== 'chat') {
    _detachChatStream();
  }
  currentView = view;
  clearInterval(_sessionsRefreshTimer);
  closeWorkerModal();
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.view === view));
  renderView(view, params);
}

function renderView(view, params) {
  const main = document.getElementById('main');
  if (view === 'chat') main.style.padding = '0';
  else main.style.padding = '18px 20px';
  main.innerHTML = '<div class="loading">Loading…</div>';
  switch (view) {
    case 'overview':  renderOverview();          break;
    case 'chat':      renderChat(params);        break;
    case 'sessions':  renderSessions();          break;
    case 'session':   renderSession(params);     break;
    case 'kanban':    renderKanbanList();         break;
    case 'board':     renderBoard(params);        break;
    case 'meetings':  renderMeetingList();        break;
    case 'meeting':   renderMeeting(params);      break;
    case 'costs':     renderCosts();             break;
  }
}

// ── Chat ────────────────────────────────────────────────────────
function renderChat(sessionId) {
  if (sessionId) _chatSessionId = sessionId;
  const main = document.getElementById('main');
  main.innerHTML = `
    <div id="chat-area" style="height:100%;display:flex;flex-direction:column">
      <div id="chat-model-bar">
        Model:
        <select id="chat-model">
          <option value="">— default —</option>
          <option value="deepseek-v4-flash">deepseek-v4-flash</option>
          <option value="deepseek-chat">deepseek-chat</option>
          <option value="deepseek-reasoner">deepseek-reasoner</option>
          <option value="claude-sonnet-4-6">claude-sonnet-4-6</option>
          <option value="claude-haiku-4-5">claude-haiku-4-5</option>
        </select>
        ${_chatSessionId ? `<span style="margin-left:10px" class="sid">session: ${_chatSessionId}</span>
          <button class="del-btn" onclick="newChat()" style="margin-left:auto">New ＋</button>` : ''}
      </div>
      <div id="chat-messages">
        ${!_chatSessionId ? '<div class="chat-msg sys-msg">New session — send a message to begin</div>' : ''}
      </div>
      <div id="chat-input-bar">
        <textarea id="chat-input" placeholder="Message…" rows="1" onkeydown="chatKeydown(event)"></textarea>
        <button id="chat-send" onclick="chatSend()">Send</button>
        <button id="chat-interrupt" class="interrupt-btn" onclick="interruptChat()" style="display:none">Interrupt</button>
      </div>
    </div>`;

    loadChatHistory(_chatSessionId);
  }

}

function newChat() {
  _chatSessionId = null;
  if (_chatSSE) { _chatSSE.close(); _chatSSE = null; }
  renderChat();
}

function openTalk(sid) {
  if (_chatSessionId && _chatSessionId !== sid) _detachChatStream();
  _chatSessionId = sid;
  nav('chat', sid);
  highlightActiveTalk();
}

function startNewTalk() {
  _chatSessionId = null;
  if (_chatSSE) { _chatSSE.close(); _chatSSE = null; }
  nav('chat');
  highlightActiveTalk();
}

function highlightActiveTalk() {
  document.querySelectorAll('#talks-nav .nav-item').forEach(el => {
    const onclick = el.getAttribute('onclick') || '';
    el.classList.toggle('active', !!_chatSessionId && onclick.includes(`'${_chatSessionId}'`));
  });
}

async function loadChatHistory(sid) {
  try {
    const data = await api(`/api/sessions/${sid}`);
    const msgs = (data.messages || []).filter(m => m.role !== 'system');
    const container = document.getElementById('chat-messages');
    if (!container) return;
    container.innerHTML = '';
    msgs.forEach((m, i) => container.insertAdjacentHTML('beforeend', renderChatMessage(m, i)));
    container.scrollTop = container.scrollHeight;
    const streamIsStale = _streamLog && !document.body.contains(_streamLog);
    if (data.is_active && currentView === 'chat' && _chatSessionId === sid && (!_chatRunning || streamIsStale || !_chatSSE)) {
      _attachChatStream(sid);
    }
  } catch {}
}

function renderChatMessage(msg, idx) {
  const role = msg.role || '';
  if (role === 'user') {
    const text = typeof msg.content === 'string' ? msg.content : JSON.stringify(msg.content, null, 2);
    return `<div class="chat-msg user-msg">${esc(text)}</div>`;
  }
  if (role === 'assistant') {
    const text = msg.content || '';
    const tcs = msg.tool_calls || [];
    const tools = tcs.filter(tc => (tc.function || {}).name !== 'respond_to_user').map(tc => {
      const fn = tc.function || {};
      let argsText = fn.arguments || '';
      try { argsText = JSON.stringify(JSON.parse(argsText), null, 2); } catch {}
      const toolId = `hist-tool-${idx}-${(tc.id||String(Math.random())).replace(/[^a-z0-9_-]/gi,'')}`;
      return `<div class="stream-tool done">
        <div class="stream-tool-row" onclick="streamToggleArgs('${toolId}')">
          <span class="stream-tool-icon"><span style="color:var(--green)">✓</span></span>
          <span class="stream-tool-name">${esc(fn.name||'tool')}</span>
          <span class="stream-tool-elapsed"></span>
          <span class="stream-tool-chevron" id="ch-${toolId}">▾</span>
        </div>
        <pre class="stream-tool-args open" id="${toolId}">${esc(argsText)}</pre>
      </div>`;
    }).join('');
    const responseBubbles = tcs
      .filter(tc => (tc.function || {}).name === 'respond_to_user')
      .map(tc => respondMessageFromArgs((tc.function || {}).arguments || ''))
      .filter(Boolean)
      .map(text => `<div class="chat-msg bot-msg">${esc(text)}</div>`)
      .join('');
    return `${tools ? `<div class="stream-log">${tools}</div>` : ''}${text ? `<div class="chat-msg bot-msg">${esc(text)}</div>` : ''}${responseBubbles}`;
  }
  if (role === 'tool') {
    if (msg.name === 'respond_to_user') return '';
    const text = typeof msg.content === 'string' ? msg.content : JSON.stringify(msg.content, null, 2);
    const toolId = `hist-result-${idx}`;
    return `<div class="stream-log">
      <div class="stream-tool done">
        <div class="stream-tool-row" onclick="streamToggleArgs('${toolId}')">
          <span class="stream-tool-icon"><span style="color:var(--green)">✓</span></span>
          <span class="stream-tool-name">${esc(msg.name || 'tool result')}</span>
          <span class="stream-tool-elapsed"></span>
          <span class="stream-tool-chevron" id="ch-${toolId}">▸</span>
        </div>
        <pre class="stream-tool-args" id="${toolId}">${esc(text)}</pre>
      </div>
    </div>`;
  }
  return '';
}

function respondMessageFromArgs(argsText) {
  try {
    const parsed = JSON.parse(argsText || '{}');
    return String(parsed.message || parsed.content || parsed.text || '');
  } catch {
    return argsText || '';
  }
}

function chatKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); chatSend(); }
}

function autoResizeTextarea(el) {
  el.addEventListener('input', () => { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 160) + 'px'; });
}

async function chatSend() {
  if (_chatRunning) return;
  const input = document.getElementById('chat-input');
  const msg = (input.value || '').trim();
  if (!msg) return;

  input.value = '';
  input.style.height = 'auto';

  const model = document.getElementById('chat-model')?.value || '';
  appendChatMsg('user', msg);
  _chatRunning = true;
  document.getElementById('chat-send').disabled = true;
  const interruptBtn = document.getElementById('chat-interrupt');
  if (interruptBtn) { interruptBtn.style.display = ''; interruptBtn.disabled = false; interruptBtn.textContent = 'Interrupt'; }

  // Create stream log container
  const logEl = document.createElement('div');
  logEl.className = 'stream-log';
  document.getElementById('chat-messages').appendChild(logEl);
  _streamLog     = logEl;
  _currentToolEl = null;
  _toolStartMs   = 0;
  _assistantMessageShown = false;
  _lastAssistantMessageText = '';
  scrollChat();

  try {
    const body = { message: msg, model: model || undefined };
    if (_chatSessionId) body.session_id = _chatSessionId;
    const resp = await apiFetch('/api/chat', { method: 'POST', body: JSON.stringify(body) });
    _chatSessionId = resp.session_id;

    const header = document.querySelector('#chat-model-bar .sid');
    if (header) header.textContent = `session: ${_chatSessionId}`;
    else document.getElementById('chat-model-bar').insertAdjacentHTML('beforeend',
      `<span class="sid" style="margin-left:10px">session: ${_chatSessionId}</span>`+
      `<button class="del-btn" onclick="newChat()" style="margin-left:auto">New ＋</button>`);

    if (_chatSSE) { _chatSSE.close(); _chatSSE = null; }
    _chatSSE = new EventSource(`/api/chat/${_chatSessionId}/stream`);
    _chatSSE.onmessage = (e) => { try { handleChatEvent(JSON.parse(e.data)); } catch {} };
    _chatSSE.onerror = () => {
      _streamSysMsg('⚠ connection lost');
      _chatFinish();
      if (_chatSSE) { _chatSSE.close(); _chatSSE = null; }
    };
  } catch(err) {
    if (err.message === 'HTTP 409' && _chatSessionId) {
      const sid = _chatSessionId;
      _streamSysMsg(
        `⚠ Session busy — another run is still active. ` +
        `<button onclick="forceStopSession('${sid}',this)" style="margin-left:6px">Force Stop</button>`
      );
    } else {
      _streamSysMsg('⚠ ' + err.message);
    }
    _chatFinish();
  }
}

async function forceStopSession(sid, btn) {
  btn.disabled = true; btn.textContent = 'Stopping…';
  try {
    await apiFetch(`/api/chat/${sid}/lock`, {method:'DELETE'});
    btn.textContent = 'Stopped — you can send again';
  } catch(e) {
    btn.textContent = 'Failed: ' + e.message;
  }
}

async function interruptChat() {
  if (!_chatSessionId || !_chatRunning) return;
  const btn = document.getElementById('chat-interrupt');
  if (btn) { btn.disabled = true; btn.textContent = 'Interrupting...'; }
  try {
    await apiFetch(`/api/chat/${encodeURIComponent(_chatSessionId)}/interrupt`, {method:'POST'});
    _streamSysMsg('interrupt requested');
  } catch(e) {
    _streamSysMsg('interrupt failed: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Interrupt'; }
  }
}

function handleChatEvent(ev) {
  const type = ev.type;
  if (type === 'iteration') {
    _streamFinishTool();
    const el = document.createElement('div');
    el.className = 'stream-iter';
    el.innerHTML = `<span class="stream-iter-num">#${ev.i}</span> iteration`;
    _streamLog && _streamLog.appendChild(el);
    scrollChat();

  } else if (type === 'tool_start') {
    _streamFinishTool();
    _toolStartMs = Date.now();
    const argsText = ev.args || '';
    const toolId   = 'st-' + Date.now();
    const el = document.createElement('div');
    el.className = 'stream-tool running';
    el.innerHTML = `
      <div class="stream-tool-row" onclick="streamToggleArgs('${toolId}')">
        <span class="stream-tool-icon"><span class="spinner"></span></span>
        <span class="stream-tool-name">${esc(ev.name||'')}</span>
        <span class="stream-tool-elapsed" id="e-${toolId}"></span>
        <span class="stream-tool-chevron" id="ch-${toolId}">▾</span>
      </div>
      <pre class="stream-tool-args open" id="${toolId}">${esc(argsText)}</pre>`;
    _streamLog && _streamLog.appendChild(el);
    _currentToolEl = el;
    scrollChat();

  } else if (type === 'tool_end') {
    _streamFinishTool(false, ev.result || '');
    scrollChat();

  } else if (type === 'assistant_message') {
    _streamFinishTool();
    const text = ev.text || '';
    if (text) {
      appendChatMsg('bot', text);
      _assistantMessageShown = true;
      _lastAssistantMessageText = text;
    }

  } else if (type === 'event') {
    const detail = [ev.label, ev.detail].filter(Boolean).join(' ');
    if (detail) _streamSysMsg(detail);

  } else if (type === 'compact') {
    _streamFinishTool();
    _streamSysMsg('⟳ compacting context…');

  } else if (type === 'final_answer') {
    _streamFinishTool();

  } else if (type === 'done') {
    _streamFinishTool();
    if (ev.final && (!_assistantMessageShown || ev.final.trim() !== _lastAssistantMessageText.trim())) {
      appendChatMsg('bot', ev.final);
    }
    _chatFinish();
    if (_chatSSE) { _chatSSE.close(); _chatSSE = null; }
    scrollChat();

  } else if (type === 'error') {
    _streamFinishTool(true);
    appendChatMsg('sys', '⚠ ' + (ev.error || 'error'));
    _chatFinish();
    if (_chatSSE) { _chatSSE.close(); _chatSSE = null; }
  }
}

function _streamFinishTool(isErr, resultText) {
  if (!_currentToolEl) return;
  const elapsed = _toolStartMs ? ((Date.now() - _toolStartMs) / 1000).toFixed(1) + 's' : '';
  _currentToolEl.classList.remove('running');
  _currentToolEl.classList.add(isErr ? 'error' : 'done');
  const icon = _currentToolEl.querySelector('.stream-tool-icon');
  if (icon) icon.innerHTML = isErr ? '<span style="color:var(--red)">✗</span>' : '<span style="color:var(--green)">✓</span>';
  const et = _currentToolEl.querySelector('[id^="e-"]');
  if (et && elapsed) et.textContent = elapsed;
  if (resultText) {
    const inputPre = _currentToolEl.querySelector('.stream-tool-args');
    const resultId = (inputPre && inputPre.id ? inputPre.id : ('tool-' + Date.now())) + '-result';
    const row = document.createElement('div');
    row.className = 'stream-tool-row';
    row.setAttribute('onclick', `streamToggleArgs('${resultId}')`);
    row.innerHTML = `
      <span class="stream-tool-icon">↳</span>
      <span class="stream-tool-name">result</span>
      <span class="stream-tool-elapsed"></span>
      <span class="stream-tool-chevron" id="ch-${resultId}">▸</span>`;
    const pre = document.createElement('pre');
    pre.className = 'stream-tool-args';
    pre.id = resultId;
    pre.textContent = resultText;
    _currentToolEl.appendChild(row);
    _currentToolEl.appendChild(pre);
  }
  _currentToolEl = null;
  _toolStartMs   = 0;
}

function _streamSysMsg(text) {
  if (!_streamLog) return;
  const el = document.createElement('div');
  el.className = 'stream-sys';
  el.textContent = text;
  _streamLog.appendChild(el);
  scrollChat();
}

function _chatFinish() {
  _chatRunning = false;
  const btn = document.getElementById('chat-send');
  if (btn) btn.disabled = false;
  const interruptBtn = document.getElementById('chat-interrupt');
  if (interruptBtn) { interruptBtn.disabled = false; interruptBtn.style.display = 'none'; interruptBtn.textContent = 'Interrupt'; }
  _streamLog    = null;
  _currentToolEl = null;
}

function streamToggleArgs(toolId) {
  const argsEl = document.getElementById(toolId);
  const chevEl = document.getElementById('ch-' + toolId);
  if (!argsEl) return;
  const open = argsEl.classList.toggle('open');
  if (chevEl) chevEl.textContent = open ? '▾' : '▸';
}

function appendChatMsg(role, text) {
  const container = document.getElementById('chat-messages');
  if (!container) return;
  const div = document.createElement('div');
  div.className = `chat-msg ${role === 'user' ? 'user-msg' : role === 'sys' ? 'sys-msg' : 'bot-msg'}`;
  div.textContent = text;
  container.appendChild(div);
  scrollChat();
}

function scrollChat() {
  const c = document.getElementById('chat-messages');
  if (c) c.scrollTop = c.scrollHeight;
}
function removeEl(id) { const el = document.getElementById(id); if (el) el.remove(); }

// ── Sessions list ────────────────────────────────────────────────
function _sessionTableHeader() {
  return `<div style="display:flex;padding:5px 11px;border-bottom:1px solid var(--border);font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em">
    <span style="flex:1">Session ID</span><span style="min-width:110px">Model</span>
    <span style="min-width:50px;text-align:right">Msgs</span>
    <span style="min-width:70px;text-align:right">Tokens</span>
    <span style="min-width:70px;text-align:right">Cost</span>
    <span style="min-width:115px;text-align:right">Date</span>
    <span style="width:32px"></span></div>`;
}
function _sessionRows(list) {
  if (!list.length) return '<div class="empty-state">No sessions</div>';
  return list.map(s=>`
    <div class="session-row${s.is_active ? ' active' : ''}">
      <div class="s-id" onclick="nav('session','${s.id}')" style="display:flex;align-items:center">
        ${s.is_active ? '<span class="active-dot" title="Agent running"></span>' : ''}
        ${esc(s.id)}
      </div>
      <div class="s-model" onclick="nav('session','${s.id}')">${esc(s.model||'—')}</div>
      <div class="s-msgs"  onclick="nav('session','${s.id}')">${s.message_count}</div>
      <div class="s-msgs"  onclick="nav('session','${s.id}')" style="color:var(--muted)">${fmtTok((s.in_tokens||0)+(s.out_tokens||0))}</div>
      <div class="s-cost"  onclick="nav('session','${s.id}')">${s.cost>0?'$'+s.cost.toFixed(4):'—'}</div>
      <div class="s-date"  onclick="nav('session','${s.id}')">${s.created_at}</div>
      <button class="del-btn" title="Delete" onclick="deleteSession('${s.id}',this)">✕</button>
    </div>`).join('');
}

async function renderSessions() {
  clearInterval(_sessionsRefreshTimer);
  const sessions = await api('/api/sessions');
  const mainSess = sessions.filter(s => !s.is_sub);
  const subSess  = sessions.filter(s =>  s.is_sub);
  const activeCnt = sessions.filter(s => s.is_active).length;
  const el = document.getElementById('main');
  el.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <div class="section-title" style="margin:0">Sessions — Main (${mainSess.length})</div>
      ${activeCnt ? `<span style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--green)"><span class="active-dot"></span>${activeCnt} running</span>` : ''}
    </div>
    <div class="panel">${_sessionTableHeader()}${_sessionRows(mainSess)}</div>
    ${subSess.length ? `
    <div class="section-title" style="margin-top:18px;cursor:pointer" onclick="toggleSubSessions(this)">
      Sub-agent Sessions (${subSess.length}) <span id="sub-toggle-hint" style="font-size:11px;color:var(--muted)">▸ expand</span>
    </div>
    <div id="sub-sessions-panel" style="display:none">
      <div class="panel">${_sessionTableHeader()}${_sessionRows(subSess)}</div>
    </div>` : ''}`;
  // Auto-refresh every 4s while any session is active
  if (activeCnt && currentView === 'sessions') {
    _sessionsRefreshTimer = setInterval(() => {
      if (currentView === 'sessions') renderSessions();
      else clearInterval(_sessionsRefreshTimer);
    }, 4000);
  }
}
function toggleSubSessions(hdr) {
  const panel = document.getElementById('sub-sessions-panel');
  if (!panel) return;
  const open = panel.style.display !== 'none';
  panel.style.display = open ? 'none' : '';
  const hint = document.getElementById('sub-toggle-hint');
  if (hint) hint.textContent = open ? '▸ expand' : '▾ collapse';
}

async function deleteSession(id, btn) {
  if (!confirm(`Delete session ${id}?`)) return;
  await apiFetch(`/api/sessions/${id}`, {method:'DELETE'});
  btn.closest('.session-row').remove();
  updateStatPill('tb-sessions');

function renderMessage(msg, idx) {
  const role = msg.role || '';
  if (role === 'system') return '';

  let content = '';
  if (role === 'user') {
    const text = typeof msg.content === 'string' ? msg.content : (Array.isArray(msg.content) ? msg.content.map(c=>c.text||'').join('\n') : JSON.stringify(msg.content, null, 2));
    content = `<div class="msg-content">${esc(text)}</div>`;
  } else if (role === 'assistant') {
    const text = msg.content || '';
    const tcs  = msg.tool_calls || [];
    const thinkContent = msg.thinking || '';
    content = `
      ${thinkContent ? `<details style="margin-bottom:6px"><summary style="color:var(--muted);font-size:11px;cursor:pointer">thinking…</summary><div style="padding:6px;color:var(--muted);font-size:11px;white-space:pre-wrap;font-family:var(--mono)">${esc(thinkContent)}</div></details>` : ''}
      ${text ? `<div class="msg-content">${esc(text)}</div>` : ''}
      ${tcs.map(tc => {
        const fn = tc.function || {};
        if (fn.name === 'respond_to_user') {
          const responseText = respondMessageFromArgs(fn.arguments || '');
          return responseText ? `<div class="msg-content">${esc(responseText)}</div>` : '';
        }
        let argsText = fn.arguments || '';
        try { argsText = JSON.stringify(JSON.parse(argsText), null, 2); } catch {}
        const elId  = 'tc' + idx + '_' + (tc.id||'').slice(-6);
        const csId  = csStore(argsText);
        const long  = argsText.length > 2000;
        return `<div class="tool-call">
          <span class="tool-call-name">${esc(fn.name||'')}</span>
          <div class="tool-call-args${long ? ' collapsed' : ''}" id="${elId}" data-cs-id="${csId}">${esc(argsText)}</div>
          ${long ? `<button class="expand-btn" onclick="csToggle('${elId}',this)">expand</button>` : ''}
        </div>`;
      }).join('')}`;
  } else if (role === 'tool') {
    if (msg.name === 'respond_to_user') return '';
    const text = typeof msg.content === 'string' ? msg.content : JSON.stringify(msg.content, null, 2);
    const elId  = 'tr' + idx;
    const csId  = csStore(text);
    const long  = text.length > 2000;
    content = `
      <div class="msg-content" id="${elId}" data-cs-id="${csId}" style="font-family:var(--mono);font-size:11px;color:var(--muted)">${esc(text)}</div>
      ${long ? `<button class="expand-btn" onclick="csToggle('${elId}',this)">collapse</button>` : ''}`;
  }

  const roleLabel = role === 'tool' ? `tool result${msg.tool_call_id ? ' · '+msg.tool_call_id.slice(-8) : ''}` : role;
  return `<div class="msg ${role}"><div class="msg-role">${roleLabel}</div>${content}</div>`;
}

async function renderBoard(boardName) {
  const data = await api(`/api/kanban/${boardName}`);
  const main = document.getElementById('main');
  const tasks = Object.values(data.tasks || {});
  const byStatus = {ready:[],running:[],done:[],error:[]};
  for (const t of tasks) {
    const s = t.status || 'ready';
    if (s === 'blocked' || s === 'cancelled') { byStatus.error.push(t); continue; }
    if (byStatus[s]) byStatus[s].push(t); else byStatus.ready.push(t);
  }
  const cols = [{k:'ready',l:'Ready'},{k:'running',l:'Running'},{k:'done',l:'Done'},{k:'error',l:'Error/Blocked'}];
  main.innerHTML = `
    <button class="back-btn" onclick="nav('kanban')">← Boards</button>
    <div class="panel">
      <div class="panel-header">
        ⊞ ${esc(boardName)}

        <button class="del-btn" onclick="deleteBoardNav('${boardName}')">Delete board</button>
      </div>
      <div class="panel-body">
        <div class="kanban-columns">
          ${cols.map(col=>`
            <div class="kanban-col col-${col.k}">
              <div class="kanban-col-header">${col.l} (${byStatus[col.k].length})</div>
              ${byStatus[col.k].map(t=>renderTaskCard(t, boardName)).join('')}

      </div>

}

function renderTaskCard(task, boardName) {
  const id = (task.id||'').replace(/[^a-z0-9]/gi,'_');

  return `
    <div class="task-card" id="tc_${id}" data-board="${esc(boardName)}" data-task="${esc(task.id||'')}" onclick="openWorkerModal(event,this)">

}
function toggleTask(id) { const el=document.getElementById(id); if(el) el.classList.toggle('expanded'); }

function openWorkerModal(event, cardEl) {
  event.stopPropagation();
  const boardName = cardEl.dataset.board || '';
  const taskId = cardEl.dataset.task || '';
  if (!boardName || !taskId) return;
  closeWorkerModal();
  _workerModalTarget = {boardName, taskId};
  document.body.insertAdjacentHTML('beforeend', `
    <div class="worker-modal-overlay" id="worker-modal-overlay" onclick="if(event.target===this) closeWorkerModal()">
      <div class="worker-modal">
        <div class="worker-modal-head">
          <div class="worker-modal-title" id="worker-modal-title">${esc(taskId)}</div>
          <div class="worker-modal-meta" id="worker-modal-meta">loading</div>
          <button class="worker-modal-close" onclick="closeWorkerModal()">Close</button>
        </div>
        <div class="worker-modal-body" id="worker-modal-body">
          <div class="stream-log"><div class="stream-sys">loading worker actions...</div></div>
        </div>
      </div>
    </div>`);
  refreshWorkerModal();
  _workerModalTimer = setInterval(refreshWorkerModal, 1500);
}

function closeWorkerModal() {
  if (_workerModalTimer) clearInterval(_workerModalTimer);
  _workerModalTimer = null;
  _workerModalTarget = null;
  const el = document.getElementById('worker-modal-overlay');
  if (el) el.remove();
}

async function refreshWorkerModal() {
  if (!_workerModalTarget) return;
  const {boardName, taskId} = _workerModalTarget;
  const body = document.getElementById('worker-modal-body');
  if (!body) return;
  try {
    const data = await api(`/api/kanban/${encodeURIComponent(boardName)}/tasks/${encodeURIComponent(taskId)}/worker`);
    const task = data.task || {};
    const status = data.status || task.status || 'unknown';
    const title = task.title || taskId;
    const titleEl = document.getElementById('worker-modal-title');
    const metaEl = document.getElementById('worker-modal-meta');
    if (titleEl) titleEl.textContent = title;
    if (metaEl) metaEl.textContent = `${status} · ${taskId}`;
    const messages = (data.messages || []).filter(m => m.role !== 'system');
    if (messages.length) {
      body.innerHTML = messages.map((m, i) => renderChatMessage(m, i)).join('');
    } else if (data.final) {
      body.innerHTML = `<div class="chat-msg bot-msg">${esc(data.final)}</div>`;
    } else if (data.error) {
      body.innerHTML = `<div class="chat-msg sys-msg">worker error: ${esc(data.error)}</div>`;
    } else {
      body.innerHTML = '<div class="stream-log"><div class="stream-sys">worker has not emitted actions yet</div></div>';
    }
    body.scrollTop = body.scrollHeight;
    if (!['queued', 'running'].includes(status) && _workerModalTimer) {
      clearInterval(_workerModalTimer);
      _workerModalTimer = null;
    }
  } catch (e) {
    body.innerHTML = `<div class="chat-msg sys-msg">failed to load worker: ${esc(e.message)}</div>`;
    if (_workerModalTimer) clearInterval(_workerModalTimer);
    _workerModalTimer = null;
  }
}

  }

        </div>`).join('')}

    ${data.notes ? `<div class="notes-box">${esc(data.notes)}</div>` : ''}
    ${renderMeetingActions(actions, transcript)}
    ${data.conclusion ? `<div class="conclusion-box">${esc(data.conclusion)}</div>` : ''}`;

function renderMeetingActions(actions, transcript) {
  if (actions && actions.length) {
    return `
      <div class="section-title" style="margin-top:12px">Moderator Actions (${actions.length})</div>
      <div class="meeting-actions">${actions.map(renderMeetingAction).join('')}</div>`;
  }
  if (!transcript || !transcript.length) return '';
  return `
    <div class="section-title" style="margin-top:12px">Meeting Activity (${transcript.length})</div>
    <div class="meeting-actions">
      ${transcript.map(e => `
        <div class="meeting-action">
          <div class="a-head">
            <span class="a-type">${e.speaker === 'moderator' ? 'moderator note' : 'participant response'}</span>
            <span class="a-time">${esc(e.timestamp || '')}</span>
          </div>
          <div class="meeting-response">
            <div class="speaker">${esc(e.speaker || '')}${e.round ? ` · round ${esc(e.round)}` : ''}</div>
            <div class="a-body">${esc(e.content || '')}</div>
          </div>
        </div>`).join('')}
    </div>`;
}

function renderMeetingAction(action) {
  const type = action.action || 'action';
  const time = action.time || '';
  let body = '';
  if (type === 'create_participants') {
    const participants = action.participants || [];
    body = `<div class="a-meta">${participants.length} participant(s)</div>` +
      participants.map(p => `<div class="meeting-response"><div class="speaker">${esc(p.name || '')}</div><div class="a-body">${esc(p.role || '')}</div></div>`).join('');
  } else if (type === 'set_agenda') {
    body = `<div class="a-body">${esc(action.agenda || '')}</div>`;
  } else if (type === 'add_notes') {
    body = `<div class="a-body">${esc(action.content || '')}</div>`;
  } else if (type === 'ask_one') {
    body = `<div class="a-meta">Question to ${esc(action.participant || '')}</div>
      <div class="a-body">${esc(action.question || '')}</div>
      <div class="meeting-response"><div class="speaker">${esc(action.participant || '')}</div><div class="a-body">${esc(action.response || '')}</div></div>`;
  } else if (type === 'chain' || type === 'group_discuss') {
    const label = type === 'chain' ? 'Sequential chain' : 'Group discussion';
    const prompt = action.prompt || action.topic || '';
    const rounds = action.round_results || [];
    body = `<div class="a-meta">${label} · ${esc(action.rounds || rounds.length || '')} round(s)</div>
      <div class="a-body">${esc(prompt)}</div>
      ${rounds.map((round, idx) => {
        const roundNo = round.round || idx + 1;
        const responses = round.responses || round || [];
        return `<div class="a-meta" style="margin-top:8px">Round ${esc(roundNo)}</div>` +
          responses.map(r => `<div class="meeting-response"><div class="speaker">${esc(r.speaker || '')}</div><div class="a-body">${esc(r.content || '')}</div></div>`).join('');
      }).join('')}`;
  } else if (type === 'conclude') {
    body = `<div class="a-body">${esc(action.conclusion || '')}</div>`;
  } else {
    body = `<div class="a-body">${esc(JSON.stringify(action, null, 2))}</div>`;
  }
  return `
    <div class="meeting-action">
      <div class="a-head">
        <span class="a-type">${esc(type.replace(/_/g, ' '))}</span>
        <span class="a-time">${esc(time)}</span>
      </div>
      ${body}
    </div>`;
}

}

// ── SSE live updates ─────────────────────────────────────────────────
function startSSE() {
  const es = new EventSource('/api/events');
  es.onmessage = (e) => {
    document.getElementById('live-time').textContent = new Date().toLocaleTimeString();
    try {
      const ev = JSON.parse(e.data);
      // Auto-resume: if our current chat session just got triggered by a kanban notification
      if (ev.resumed_sessions && ev.resumed_sessions.includes(_chatSessionId) && currentView === 'chat') {
        _attachChatStream(_chatSessionId);
      }
      if (
        currentView === 'chat' &&
        _chatSessionId &&
        !_chatRunning &&
        (ev.active_talks || []).some(s => s.id === _chatSessionId)
      ) {
        _attachChatStream(_chatSessionId);
      }
    } catch {}
    api('/api/overview').then(data => { updateTopbar(data); updateSidebarLive(data); }).catch(()=>{});
  };
  es.onerror = () => { document.getElementById('live-dot').style.background = 'var(--red)'; };
}

function _detachChatStream() {
  if (_chatSSE) { _chatSSE.close(); _chatSSE = null; }
  _chatRunning = false;
  _streamLog = null;
  _currentToolEl = null;
  _toolStartMs = 0;
}

function _attachChatStream(sid) {
  const streamIsStale = _streamLog && !document.body.contains(_streamLog);
  if (_chatRunning && _chatSSE && _streamLog && !streamIsStale) return;
  if (_chatSSE) { _chatSSE.close(); _chatSSE = null; }
  _chatRunning = true;
  const sendBtn = document.getElementById('chat-send');
  if (sendBtn) sendBtn.disabled = true;
  const interruptBtn = document.getElementById('chat-interrupt');
  if (interruptBtn) { interruptBtn.style.display = ''; interruptBtn.disabled = false; interruptBtn.textContent = 'Interrupt'; }

  const logEl = document.createElement('div');
  logEl.className = 'stream-log';
  const chatMsgs = document.getElementById('chat-messages');
  if (chatMsgs) { chatMsgs.appendChild(logEl); scrollChat(); }
  _streamLog     = logEl;
  _currentToolEl = null;
  _toolStartMs   = 0;

  _chatSSE = new EventSource(`/api/chat/${sid}/stream`);
  _chatSSE.onmessage = (e) => { try { handleChatEvent(JSON.parse(e.data)); } catch {} };
  _chatSSE.onerror = () => {
    _streamSysMsg('⚠ connection lost');
    _chatFinish();
    if (_chatSSE) { _chatSSE.close(); _chatSSE = null; }
  };
}

// ── Helpers ─────────────────────────────────────────────────────────
async function shutdownServer(btn) {
  if (!confirm('Shutdown the local web server? Running workers started by this server will exit too.')) return;
  btn.disabled = true;
  btn.textContent = 'Shutting down...';
  try {
    await apiFetch('/api/shutdown', {method:'POST'});
    document.getElementById('live-dot').style.background = 'var(--red)';
    document.getElementById('live-time').textContent = 'offline';
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'Shutdown';
    alert('Shutdown failed: ' + e.message);
  }
}

async function api(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}
async function apiFetch(url, opts={}) {
  const res = await fetch(url, {headers: {'Content-Type': 'application/json'}, ...opts});
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}
function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function setText(id, val) { const el=document.getElementById(id); if(el) el.textContent=val; }
function fmtTok(n) {
  if(!n) return '0';
  if(n>=1_000_000) return (n/1_000_000).toFixed(1)+'M';
  if(n>=1_000)     return (n/1_000).toFixed(1)+'K';
  return String(n);
}
function findPrice(model, prices) {
  const m=(model||'').toLowerCase();
  for(const [k,p] of Object.entries(prices||{})) { if(m.includes(k)) return p; }
  return null;
}
function updateStatPill(id) {
  api('/api/overview').then(d => { updateTopbar(d); updateSidebarLive(d); }).catch(()=>{});
}

// ── Boot ─────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => { nav('overview'); startSSE(); });
</script>
